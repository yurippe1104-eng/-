<title>パロディ雑誌メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@700;900&family=Pinyon+Script&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: editor chrome (preview left, field panel right) around a fixed 1080×1920 cover stage. */
:root{
  --bg:#f2eff3; --panel:#ffffff; --fg:#1d1820; --muted:#6c6471; --line:#e1dbe4;
  --accent:#c8102e; --accent-fg:#ffffff; --field:#f8f6f9;
  --f-ui:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141116; --panel:#1e1a21; --fg:#efe9f1; --muted:#a69daa; --line:#352f39;
  --accent:#ff4d5e; --accent-fg:#1a0005; --field:#17141a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141116; --panel:#1e1a21; --fg:#efe9f1; --muted:#a69daa; --line:#352f39;
  --accent:#ff4d5e; --accent-fg:#1a0005; --field:#17141a; color-scheme:dark }

[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;max-width:1180px;margin:0 auto;align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:820px){.left{position:static}}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
header.top p{margin:0;color:var(--muted);font-size:12.5px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.previewWrap{display:flex;justify-content:center;min-width:0}
#frame{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 32px rgba(40,10,40,.18);background:#ddd;max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:focus-visible,.seg button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:wait}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h2{font-size:13px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.hint code{background:var(--field);border:1px solid var(--line);padding:0 4px;border-radius:4px;font-size:11.5px}
.group{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.group > summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between}
.group > summary::after{content:"＋";color:var(--muted)}
.group[open] > summary::after{content:"－"}
.field{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.field label{font-size:12px;color:var(--muted)}
.field textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:38px;line-height:1.45}
.field.flash textarea{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.photoCtl{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.photoCtl input[type=range]{width:100%;accent-color:var(--accent)}
.photoCtl output{font-variant-numeric:tabular-nums;text-align:right}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* modal + reel */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,6,12,.86);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.overlay img{max-height:78vh;max-width:100%;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.overlay p{color:#f3eef5;font-size:13px;margin:0;text-align:center}
.overlay .btn{background:#fff;color:#111;border-color:#fff}
#reel{background:#000;padding:0}
#reelStage{position:relative;overflow:hidden}
.reelBar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px;transition:opacity .4s;z-index:60}
.reelBar.hide{opacity:0;pointer-events:none}

/* ===== cover stage (fixed print colors, single look) ===== */
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:#fff;overflow:hidden;color:#111;font-family:'Noto Sans JP',sans-serif}
.cv{position:absolute;overflow:hidden;line-height:1.08;white-space:pre}
.h{display:flex;align-items:center}
.tx{display:inline-block}
.h.c{justify-content:center;text-align:center}
.h.r{justify-content:flex-end;text-align:right}
.vbox{display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:.06em}
.vcol{display:flex;flex-direction:column;align-items:center;padding-bottom:.12em}
.vc{display:block;width:1em;height:1em;line-height:1;text-align:center;flex:none}
.vc.rot{transform:rotate(90deg)}
.vc.punc{transform:translate(.55em,-.55em)}
.vc.tcy{font-size:.62em;width:1.6em;height:1.15em;line-height:1.15em;letter-spacing:-.04em}
.vc.run{position:relative;width:1em}
.vc.run > span{position:absolute;left:.92em;top:0;transform-origin:0 0;transform:rotate(90deg);white-space:nowrap;line-height:1;font-size:.9em}
.photo{position:absolute;background-color:#cfd3d6;background-repeat:no-repeat}
.dela{font-family:'Dela Gothic One','Noto Sans JP',sans-serif;font-weight:400}
.nsj{font-family:'Noto Sans JP',sans-serif;font-weight:900}
.min{font-family:'Shippori Mincho B1','Noto Serif JP',serif;font-weight:800}
.ok{text-shadow:.035em 0 #000,-.035em 0 #000,0 .035em #000,0 -.035em #000,.025em .025em #000,-.025em .025em #000,.025em -.025em #000,-.025em -.025em #000}
.ow{text-shadow:.04em 0 #fff,-.04em 0 #fff,0 .04em #fff,0 -.04em #fff,.03em .03em #fff,-.03em .03em #fff,.03em -.03em #fff,-.03em -.03em #fff}

/* tabloid */
.band1{left:0;top:0;width:1080px;height:120px;background:linear-gradient(#dcb94e,#a9852b)}
.band2{left:0;top:120px;width:1080px;height:118px;background:#fff;border-bottom:2px solid #4b1a8a}
.pur{color:#4b1a8a}
.tb-tag{background:#fff;color:#111;padding:0 .25em}
.tb-note{border:3px solid #4b1a8a;color:#4b1a8a;border-radius:6px;line-height:1.15}
.tb-box{border:7px solid #4b1a8a;color:#4b1a8a;background:#fff}
.tb-logo{color:#e5141f;transform:scaleY(1.35);transform-origin:0 0;line-height:1;
  text-shadow:.03em 0 #fff,-.03em 0 #fff,0 .03em #fff,0 -.03em #fff,.02em .02em #fff,-.02em .02em #fff,.02em -.02em #fff,-.02em -.02em #fff,.05em .05em 0 rgba(0,0,0,.35)}
.tb-issue{color:#111;line-height:1.25;text-shadow:0 0 3px #fff,0 0 3px #fff}
.tb-pill{background:#fff;border:5px solid #f08300;border-radius:60px;color:#f08300;padding-top:.3em;align-items:center}
.tb-inset{background:linear-gradient(170deg,#e8f3fb,#9ec4e0);border:4px solid #fff;display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.15em}
.tb-inset .lab{background:#ff5aa5;color:#fff;border-radius:999px;padding:.08em .4em;font-size:.48em}
.tb-inset .vbox{color:#ff2d8d;flex:1}
.lc{background:#0b0b0b;display:flex;flex-direction:column;align-items:center;gap:.12em;padding:.14em .06em}
.lc .lab{background:#fff;color:#111;font-size:.26em;padding:.08em .2em}
.lc .rw{display:flex;flex-direction:row-reverse;gap:.06em;align-items:flex-start}
.lc .big{color:#fff}
.lc .side{background:#fff;color:#111;font-size:.3em;padding:.12em .05em}
.lc .red{color:#ff3b30;font-size:.22em;text-align:center;line-height:1.15}
.lc .brk{border-top:.05em solid #fff;border-bottom:.05em solid #fff;padding:.04em 0}
.tb-pink{background:#fff;border:7px solid #ff3c8e;border-radius:26px;color:#ff3c8e}
.tb-redlab{background:#e60012;color:#fff}
.tb-rvert{background:#fff;border:5px solid #e60012;color:#e60012}
.tb-yel{display:flex;flex-direction:row-reverse;justify-content:center;gap:.06em;align-items:flex-start}
.tb-yel .s{background:#fff8a6;color:#111;font-size:.42em;padding:.1em 0}
.tb-yel .b{color:#fff;text-shadow:.04em 0 #6d5a00,-.04em 0 #6d5a00,0 .04em #6d5a00,0 -.04em #6d5a00,.03em .03em #6d5a00,-.03em -.03em #6d5a00,.03em -.03em #6d5a00,-.03em .03em #6d5a00}
.tb-ynote{background:#ffe100;color:#c2410c;border:3px solid #c2410c;line-height:1.2}
.tb-pin{display:flex;flex-direction:column;align-items:center;gap:.1em}
.tb-pin .lab{background:#ff3c8e;color:#fff;font-size:.75em;padding:.06em .3em}
.tb-pin .nm{color:#e60012;line-height:1.25;text-align:center}
.tb-rank{background:#fde4ef;border:4px solid #ff3c8e;display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.15em .1em}
.tb-rank .lab{background:#ff3c8e;color:#fff;border-radius:.6em;font-size:.36em;padding:.15em .4em;text-align:center;line-height:1.15}
.tb-rank .cols{display:flex;flex-direction:row-reverse;gap:.12em;align-items:flex-start}
.tb-rank .r1{color:#e4007f;background:#fff;padding:.1em .04em}
.tb-rank .r2{color:#5b1f8f}
.tb-money{background:#fff;border:7px solid #f08300;color:#f08300}
.tb-mv{background:#fff;display:flex;flex-direction:row-reverse;justify-content:center;gap:.1em;align-items:flex-start;border:3px solid #f08300;padding-top:.15em}
.tb-mv .a{color:#111}.tb-mv .b{color:#0068b7}
.tb-strip{background:#5b1f8f;color:#fff;gap:.4em;padding:0 .3em}
.tb-strip .bx{border:2px solid #fff;padding:0 .2em}
.tb-news{background:#fff200;display:flex;flex-direction:column}
.tb-news .ttl{background:#fff;color:#111;border-bottom:.08em solid #111;padding:.1em .2em;font-size:1.25em}
.tb-news .it{display:flex;align-items:center;gap:.3em;border-bottom:.05em solid #111;padding:.22em .2em;flex:1}
.tb-news .it .a{background:#111;color:#fff;padding:.05em .25em;font-size:.82em}
.tb-news .it .b{color:#e60012}

/* fashion */
.fs-shade{left:0;top:0;width:1080px;height:1920px;background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28))}
.fs-tag{color:#e3efbd;font-family:'Shippori Mincho B1',serif;font-weight:600;letter-spacing:.04em}
.fs-logo{color:#dbeaa0;font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:-.03em;line-height:.9}
.fs-issue{display:flex;flex-direction:column;align-items:flex-end;color:#f3f6e8;font-family:'Shippori Mincho B1',serif;font-weight:600;line-height:1.1}
.fs-issue .m{font-size:.24em;font-style:italic}
.fs-issue .n{display:flex;align-items:flex-end;gap:.15em}
.fs-issue .n b{font-size:1em;font-weight:800;line-height:.9}
.fs-issue .k{font-size:.2em}
.fs-left{display:flex;flex-direction:column;gap:.75em;color:#fbf9f2;font-family:'Shippori Mincho B1',serif;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.fs-left .sc{font-family:'Pinyon Script',cursive;font-weight:400;font-size:1.5em;color:#e3efbd;line-height:1}
.fs-left .s{font-size:.62em;font-weight:600;color:#eef3d6;margin-bottom:.2em}
.fs-left .t{line-height:1.3}
.fs-hl{color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:600;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.fs-side{color:#f6f3ea;font-family:'Shippori Mincho B1',serif;font-weight:800;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.fs-beauty{display:flex;flex-direction:column;align-items:flex-end;gap:.25em;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.35);text-align:right}
.fs-beauty .l{font-size:.6em;letter-spacing:.1em}
.fs-beauty .s{font-size:.6em}
.fs-beauty .m{font-size:1.15em;font-family:'Archivo Black','Shippori Mincho B1',sans-serif;font-weight:400;letter-spacing:-.01em}

/* reel animation */
.reel [data-step]{animation:stamp .5s cubic-bezier(.2,1.5,.45,1) both;animation-delay:calc(var(--s) * .32s + .5s)}
.reel .photo{animation:kb 9s ease-out both}
@keyframes stamp{from{opacity:0;scale:1.5}to{opacity:1;scale:1}}
@keyframes kb{from{scale:1.18;opacity:0}12%{opacity:1}to{scale:1}}
@media (prefers-reduced-motion:reduce){.reel [data-step]{animation:fade .4s both;animation-delay:calc(var(--s) * .25s)}.reel .photo{animation:none}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>

<div class="app">
  <div class="left">
    <header class="top">
      <h1>パロディ雑誌メーカー</h1>
      <p>リール用 1080×1920（9:16）</p>
    </header>
    <div class="seg" role="group" aria-label="テンプレート">
      <button type="button" id="t-tabloid" aria-pressed="true">週刊誌風「週刊ママ性」</button>
      <button type="button" id="t-fashion" aria-pressed="false">女性誌風「CRAMSSY.」</button>
    </div>
    <div class="previewWrap"><div id="frame"><div class="stage" id="stage"></div></div></div>
    <div class="actions">
      <button class="btn primary" type="button" id="btnReel">▶ リール演出で再生</button>
      <button class="btn" type="button" id="btnPng">画像にする（PNG）</button>
    </div>
  </div>

  <aside class="panel">
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>中身を選ぶ</h2>
      <div class="row">
        <button class="btn" type="button" data-preset="juku">塾高すぎ問題号</button>
        <button class="btn" type="button" data-preset="blank">空のテンプレ</button>
      </div>
      <p class="hint">表紙の文字をタップすると、その入力欄に移動します。改行で行が変わり、縦書きの欄では列が変わります。縦書きで数字を横に並べたいときは <code>[40]</code> のように囲みます。文字は枠に合わせて自動で縮みます。</p>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>写真</h2>
      <div class="row">
        <span class="btn file">写真を選ぶ<input type="file" id="photoIn" accept="image/*" aria-label="写真を選ぶ"></span>
        <button class="btn" type="button" id="photoClear">見本に戻す</button>
      </div>
      <div class="photoCtl">
        <label for="pz">拡大</label><input type="range" id="pz" min="1" max="3" step="0.01" value="1"><output id="pzo">1.00</output>
        <label for="px">左右</label><input type="range" id="px" min="-100" max="100" step="1" value="0"><output id="pxo">0</output>
        <label for="py">上下</label><input type="range" id="py" min="-100" max="100" step="1" value="0"><output id="pyo">0</output>
      </div>
    </section>
    <div id="fields"></div>
  </aside>
</div>

<div class="overlay" id="pngModal" hidden>
  <img id="pngImg" alt="書き出した表紙">
  <p>画像を長押し（パソコンは右クリック）して保存してください。</p>
  <button class="btn" type="button" id="pngClose">閉じる</button>
</div>
<div class="overlay" id="reel" hidden>
  <div id="reelStage"></div>
  <div class="reelBar" id="reelBar">
    <button class="btn" type="button" id="reelAgain">もう一度</button>
    <button class="btn" type="button" id="reelClose">閉じる</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
const W=1080,H=1920;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- vertical text ---------- */
const ROT=new Set([...'ー－—―〜～~…‥-=＝()（）<>＜＞→←']);
const PUNC=new Set([...'、。，．,.']);
const MAP={'「':'﹁','」':'﹂','『':'﹃','』':'﹄','“':'〝','”':'〟'};
function vcol(s){
  let out='';const re=/\[([^\]]{1,4})\]|[0-9A-Za-z!?！？&.]{3,}|[0-9A-Za-z!?！？]{2}|./gu;let m;
  while((m=re.exec(s))){
    const t=m[0];
    if(m[1]!==undefined) out+=`<span class="vc tcy">${esc(m[1])}</span>`;
    else if(t.length>=3) out+=`<span class="vc run" style="height:${(t.length*0.68).toFixed(2)}em"><span>${esc(t)}</span></span>`;
    else if(t.length===2) out+=`<span class="vc tcy">${esc(t)}</span>`;
    else{const c=MAP[t]||t;out+=`<span class="vc${ROT.has(t)?' rot':PUNC.has(t)?' punc':''}">${esc(c)}</span>`;}
  }
  return `<span class="vcol">${out}</span>`;
}
const vt=s=>String(s??'').split('\n').map(vcol).join('');

/* ---------- field schemas (key, label, blank text) ---------- */
const SCHEMA={
 tabloid:[
  ['上の帯（金）',[['b1Big','大見出し','大見出しを入れる!'],['b1Tag','小ラベル','専門家が徹底検証!'],['b1Sub','サブ','膨らむ期待の'],['b1End','締めの一語','実現度']]],
  ['2段目（紫）',[['b2Name','主役','主役'],['b2Note','小さな注釈','ひとこと\n注釈'],['b2Big','大見出し','逆境で挑む'],['b2Small','小見出し（2行）','○○回復\nの'],['b2Box','囲み文字','切り札']]],
  ['ロゴ・号数',[['logo','雑誌名','週刊○○'],['issue','号数・定価','○月○日合併号\n特別定価560円\n○○社'],['tag','号のキャッチ','特大\n合併号']]],
  ['右上の囲み',[['insetLabel','ラベル','ラベル'],['insetVert','縦書き見出し','縦書きの見出し']]],
  ['オレンジの縦帯',[['pill','縦書き（改行で2列）','2026年下半期\n事件簿']]],
  ['左の黒帯',[['leftLabel','ラベル','現地ルポ'],['leftBig1','特大見出し1','大見出し'],['leftSide','横の白帯','白帯の見出し'],['leftRed1','赤字1','赤い\n小見出し'],['leftBig2','特大見出し2（線つき）','見出し、'],['leftRed2','赤字2','小見出し'],['leftBig3','特大見出し3','見出し']]],

function overflows(el){
  const br=el.getBoundingClientRect();if(!br.width)return false;
  const sx=br.width/el.offsetWidth,sy=br.height/el.offsetHeight;
  const rr={left:1e9,top:1e9,right:-1e9,bottom:-1e9};
  el.querySelectorAll('*').forEach(c=>{const q=c.getBoundingClientRect();if(!q.width&&!q.height)return;
    rr.left=Math.min(rr.left,q.left);rr.top=Math.min(rr.top,q.top);rr.right=Math.max(rr.right,q.right);rr.bottom=Math.max(rr.bottom,q.bottom);});
  if(rr.right<rr.left)return false;
  const L=br.left+el.clientLeft*sx,T=br.top+el.clientTop*sy,R=L+el.clientWidth*sx,B=T+el.clientHeight*sy;
  return rr.left<L-1||rr.top<T-1||rr.right>R+1||rr.bottom>B+1;
}
function fitAll(root){
  root.querySelectorAll('.fit').forEach(el=>{
    let fs=+el.dataset.max;el.style.fontSize=fs+'px';let n=0;
    while(overflows(el)&&fs>8&&n<90){fs*=0.95;el.style.fontSize=fs.toFixed(1)+'px';n++;}
  });
}
function applyPhoto(root){

  const go=()=>{const w=el.offsetWidth,h=el.offsetHeight,iw=img.naturalWidth||900,ih=img.naturalHeight||1200;
    const s=Math.max(w/iw,h/ih)*p.z,sw=iw*s,sh=ih*s;
    el.style.backgroundImage=`url("${src}")`;el.style.backgroundSize=`${sw}px ${sh}px`;
    el.style.backgroundPosition=`${(w-sw)/2*(1+p.x/100)}px ${(h-sh)/2*(1+p.y/100)}px`;};
  if(img.complete&&img.naturalWidth)go();else img.onload=go;
}
