<title>ジュクキュ! 11月号</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Caveat:wght@600&family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@800;900&family=Noto+Sans+JP:wght@500;700;900&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: canvas cover preview on the left, layer exports + copy fields on the right. */
:root{
  --bg:#f1f2ef; --panel:#ffffff; --fg:#1e2321; --muted:#68706c; --line:#dde1de;
  --accent:#23897d; --accent-fg:#ffffff; --field:#f7f8f6;
  --f-ui:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121514; --panel:#1b1f1d; --fg:#e8ecea; --muted:#9da6a1; --line:#2f3532;
  --accent:#5fcbbd; --accent-fg:#0d1513; --field:#151917; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121514; --panel:#1b1f1d; --fg:#e8ecea; --muted:#9da6a1; --line:#2f3532;
  --accent:#5fcbbd; --accent-fg:#0d1513; --field:#151917; color-scheme:dark }
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px;max-width:1120px;margin:0 auto;align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;align-items:center;min-width:0}
@media (max-width:820px){.left{position:static}}
#cv{display:block;width:auto;height:min(78vh,calc((100vw - 32px) * 16 / 9));max-width:100%;aspect-ratio:9/16;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 14px 36px rgba(0,0,0,.18);background:#fff}
.toggles{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);justify-content:center}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h1{font-size:19px;margin:0}
.panel h2{font-size:13px;margin:0;color:var(--muted);letter-spacing:.06em}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0}
.hint code{background:var(--field);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.layers{margin:0;padding-left:1.3em;font-size:13px;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.ctl input{width:100%;accent-color:var(--accent)}
details.group{border-top:1px solid var(--line);padding-top:12px}
details.group summary{cursor:pointer;font-weight:700;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:12px;color:var(--muted)}
.field textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;line-height:1.45}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,10,9,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.overlay img{max-height:76vh;max-width:100%;border-radius:4px;background:repeating-conic-gradient(#bbb 0 25%,#eee 0 50%) 0 0/24px 24px}
.overlay p{color:#f1f1ea;font-size:13px;margin:0;text-align:center}
.overlay .btn{background:#fff;color:#111;border-color:#fff}
</style>

<div class="app">
  <div class="left">
    <canvas id="cv" width="1080" height="1920" aria-label="表紙のプレビュー"></canvas>
    <div class="toggles"><label><input type="checkbox" id="guide" checked> 人物の位置ガイド</label></div>
  </div>

  <aside class="panel">
    <div class="sec">
      <h1>ジュクキュ! 11月号</h1>
      <p class="hint">主婦向け生活情報誌風のパロディ表紙です。人物の写真はあとから重ねる前提で、層に分けて書き出せます。</p>
    </div>
    <div class="sec">
      <h2>書き出す</h2>
      <div class="row">
        <button class="btn primary" type="button" data-out="back">① 背景＋ロゴ</button>
        <button class="btn primary" type="button" data-out="text">③ 文字（透明）</button>
        <button class="btn" type="button" data-out="all">完成見本</button>
      </div>
      <ol class="layers">
        <li>いちばん下に「① 背景＋ロゴ」</li>
        <li>その上に切り抜いた人物（胸から上、顔は点線の円あたり）</li>
        <li>いちばん上に「③ 文字」</li>
      </ol>
      <p class="hint">③には人物の下端を白くぼかす帯が入っているので、切り抜きの切れ目が見えず、写真が誌面に溶け込みます。</p>
    </div>
    <div class="sec">
      <h2>切り抜き人物を試しに置く（任意）</h2>
      <div class="row">
        <span class="btn file">透過PNGを選ぶ<input type="file" id="cut" accept="image/png,image/webp,image/*" aria-label="切り抜き人物を選ぶ"></span>
        <button class="btn" type="button" id="cutClear">外す</button>
      </div>
      <div class="ctl">
        <label for="cs">大きさ</label><input type="range" id="cs" min="0.4" max="2" step="0.01" value="1">
        <label for="cx">左右</label><input type="range" id="cx" min="-500" max="500" step="1" value="0">
        <label for="cy">上下</label><input type="range" id="cy" min="-600" max="600" step="1" value="0">
      </div>
    </div>
    <div class="sec" id="fields"></div>
  </aside>
</div>

<div class="overlay" id="modal" hidden>
  <img id="outImg" alt="書き出した画像">
  <p id="outNote">画像を長押し（パソコンは右クリック）して保存してください。</p>
  <button class="btn" type="button" id="close">閉じる</button>
</div>

<script>
(function(){
const W=1080,H=1920;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TEAL='#2a9d8f',INK='#2b2622',YEL='#f7d330',BROWN='#6d4c3d';

const FIELDS=[
 ['ロゴ・上の帯',[['num','号数'],['topline','いちばん上の一行（／で区切る）'],['logo','雑誌名'],['script','ロゴ下の筆記体'],['price','右上の小さな文字']]],
 ['左の大見出し',[['lLead','前置き（小）'],['l1','1行目　^小さく^'],['l2','2行目'],['l3','3行目'],['lBand','ティールの帯'],['lNote','帯の下（小）']]],
 ['左の小見出し',[['iLab','英字ラベル'],['iName','インタビュー'],['s1a','小見出しA（前置き）'],['s1b','小見出しA'],['s2a','小見出しB（前置き）'],['s2b','小見出しB']]],
 ['左下の囲み',[['bxTop','上のラベル'],['bxBig','大きな文字'],['bxSub','説明'],['bxTag','ハッシュタグ'],['bxHand','手書き風'],['bxEnd','締め']]],
 ['右の付録・丸',[['bookYear','付録の表紙の年'],['fTag','付録ラベル'],['c1','丸の中・大'],['c2','丸の中・中'],['c3','丸の中・名前'],['cPill','黒いラベル']]],
 ['右の小見出し',[['r1','小見出し1'],['r2a','小見出し2（前置き）'],['r2b','小見出し2'],['sc','小さな丸（縦書き・改行で列）'],['scLab','小さな丸の下']]],
 ['下の大特集',[['bLead','前置き'],['bHand','手書き風の一言'],['bBig','大見出し'],['chk','チェック項目（改行で区切る）']]]
];
const DEF={
 num:'11',topline:'毎年大好評! 100万円貯まる教育費手帳／家計想い塾えらび／塾代リアル調査',
 logo:'ジュクキュ!',script:'juku you♪',price:'毎月2日発売\n特別定価935円',
 lLead:'教育費の不安が7割消えた!',l1:'教育費^の^',l2:'リアル^な^実態',l3:'大公開!',lBand:'読者1000人アンケート',lNote:'塾・習い事の月額、平均いくら?',
 iLab:'SPECIAL INTERVIEW',iName:'人気塾講師 タナカ先生^さん^',s1a:'子どもが自分から机に向かう',s1b:'おうち学習アイテムカタログ',s2a:'家計管理のプロに聞く',s2b:'教材費ゼロ術',
 bxTop:'＼ 体験ルポ ／',bxBig:'文系ママ',bxSub:'塾なしで合格させた\n家がすごかった!',bxTag:'#節約ママさん',bxHand:'月謝ゼロ',bxEnd:'教材整理術のコツ',
 bookYear:'2027',fTag:'特別付録',c1:'100^万円^',c2:'貯まる!',c3:'教育費手帳',cPill:'ライフプラン表付き',
 r1:'わが家にぴったりの塾、\n知ってますか?',r2a:'冬期講習の見積もり',r2b:'見直し術',sc:'合格の冬が\nやってきた!',scLab:'受験生ごはん',
 bLead:'物価高でも月謝は下げられる',bHand:'＼心にゆとりもできちゃう!／',bBig:'家計想い塾えらび',
 chk:'月謝の相場、知ってる?\n夏期講習は“全部入り”じゃなくていい\n個別と集団、うちに合うのは?\n1年でいくら浮く? 実例で計算'
};
const KEY='jukukyu.v1';
let S={d:{...DEF},guide:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S={...S,...s,d:{...DEF,...s.d}};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cut=null,cutT={s:1,x:0,y:0};

/* ---------- Japanese proportional setting (palt-like) ---------- */
const SMALL=new Set([...'っゃゅょぁぃぅぇぉッャュョァィゥェォヵヶ']);
const PUNC_L=new Set([...'、。，．」』）〕】!！?？:：']);  // glyph sits left/center; trim right side
const PUNC_R=new Set([...'「『（〔【']);              // glyph sits right; trim left side
const isKana=ch=>/[぀-ヿ]/.test(ch)&&ch!=='ー';
function adv(c,ch){const w=c.measureText(ch).width;
  if(!/[　-ヿ＀-￯一-鿿]/.test(ch))return {w,off:0};
  if(PUNC_L.has(ch))return {w:w*0.56,off:-w*0.04};
  if(PUNC_R.has(ch))return {w:w*0.56,off:-w*0.44};
  if(SMALL.has(ch))return {w:w*0.74,off:-w*0.13};
  if(ch==='・')return {w:w*0.5,off:-w*0.25};
  if(isKana(ch))return {w:w*0.88,off:-w*0.06};
  return {w:w*0.97,off:-w*0.015};
}
/* segments: ^small^ */
function segs(t){const o=[];String(t).split(/(\^[^^]+\^)/).forEach(p=>{if(!p)return;if(p[0]==='^'&&p.length>2)o.push({t:p.slice(1,-1),sm:true});else o.push({t:p,sm:false});});return o;}
function layoutJ(c,text,size,fontFn,track=0,smallK=0.6){
  const out=[];let x=0;segs(text).forEach(s=>{const sz=s.sm?size*smallK:size;c.font=fontFn(sz);
    for(const ch of s.t){const a=adv(c,ch);out.push({ch,x:x+a.off,sz});x+=a.w+track*(sz/size);}});
  return {glyphs:out,width:x-track};
}
function drawJ(c,text,x,y,size,fontFn,o={}){
  const L=layoutJ(c,text,size,fontFn,o.track||0,o.smallK);
  let sx=o.align==='right'?x-L.width:o.align==='center'?x-L.width/2:x;
  c.textAlign='left';c.textBaseline='alphabetic';
  L.glyphs.forEach(g=>{c.font=fontFn(g.sz);c.fillText(g.ch,sx+g.x,y);});
  return L.width;
}
function fitJ(c,text,max,fontFn,width,track=0){let s=max;for(let i=0;i<70;i++){if(layoutJ(c,text,s,fontFn,track*s/max).width<=width)break;s*=0.97;}return s;}
/* vertical */
const VROT=new Set([...'ー－〜～…‥']);const VP=new Set([...'、。']);
function drawV(c,text,x,y,size,fontFn,lead=1.18){
  String(text).split('\n').forEach((col,ci)=>{let yy=y;const cx=x-ci*size*lead;c.font=fontFn(size);c.textAlign='center';c.textBaseline='middle';
    for(const ch of col){const step=SMALL.has(ch)?size*0.82:VP.has(ch)?size*0.6:(ch==='!'||ch==='！')?size*0.85:size*0.96;
      if(VROT.has(ch)){c.save();c.translate(cx,yy+step/2);c.rotate(Math.PI/2);c.fillText(ch,0,0);c.restore();}
      else if(VP.has(ch)){c.fillText(ch,cx+size*0.55,yy-size*0.25);}
      else if(SMALL.has(ch)){c.fillText(ch,cx+size*0.1,yy+step/2-size*0.08);}
      else c.fillText(ch==='!'?'！':ch,cx,yy+step/2);
      yy+=step;}
  });c.textBaseline='alphabetic';
}

const MIN=(w)=>s=>`${w} ${s}px "Shippori Mincho B1","Hiragino Mincho ProN",serif`;
const GO=(w)=>s=>`${w} ${s}px "Noto Sans JP","Hiragino Sans",sans-serif`;
const HAND=s=>`600 ${s}px "Klee One",cursive`;

/* ---------- layers ---------- */
function drawBack(c){
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  // faint studio backdrop behind the model
  const g=c.createRadialGradient(560,820,60,560,860,620);g.addColorStop(0,'rgba(242,238,233,1)');g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g;c.fillRect(0,300,W,1200);
  // logo
  const d=S.d;c.save();c.translate(560,300);c.rotate(-0.045);c.transform(1,0,-0.16,1,0,0);
  const LF=s=>`900 ${s}px "M PLUS Rounded 1c",sans-serif`;
  const ls=fitJ(c,d.logo,190,LF,640,-6);
  const L=layoutJ(c,d.logo,ls,LF,-6*ls/190);const x0=-L.width/2;
  c.fillStyle=TEAL;L.glyphs.forEach(gl=>{c.font=LF(gl.sz);c.fillText(gl.ch,x0+gl.x,0);});
  c.restore();
  c.save();c.translate(470,350);c.rotate(-0.08);c.fillStyle=BROWN;c.font='600 62px "Caveat",cursive';c.fillText(d.script,0,0);c.restore();
}
function notebook(c,d){
  c.save();c.translate(800,372);c.rotate(0.05);
  c.shadowColor='rgba(60,40,20,.28)';c.shadowBlur=26;c.shadowOffsetX=8;c.shadowOffsetY=12;
  const g=c.createLinearGradient(0,0,220,290);g.addColorStop(0,'#efe6d8');g.addColorStop(1,'#d9cbb6');
  c.fillStyle=g;c.fillRect(0,0,220,290);c.shadowColor='transparent';
  c.fillStyle='#c9b79d';c.fillRect(0,0,12,290);
  c.fillStyle='#8a6f55';c.font='italic 500 30px "Bodoni Moda",serif';c.fillText(d.bookYear,30,52);
  c.font='500 13px "Bodoni Moda",serif';c.fillText('EDUCATION PLANNER',30,74);
  c.strokeStyle='rgba(138,111,85,.35)';c.lineWidth=1;for(let i=0;i<5;i++){c.beginPath();c.moveTo(30,110+i*20);c.lineTo(190,110+i*20);c.stroke();}
  c.fillStyle='#fff8ec';c.beginPath();c.arc(150,225,34,0,Math.PI*2);c.fill();c.fillStyle='#e9b949';c.beginPath();c.arc(150,225,14,0,Math.PI*2);c.fill();
  c.restore();
  // diagonal 付録 tag
  c.save();c.translate(792,452);c.rotate(-1.15);c.fillStyle=INK;c.fillRect(-58,-17,116,34);c.fillStyle='#fff';drawJ(c,d.fTag,0,8,20,GO(700),{align:'center',track:2});c.restore();
}
function drawText(c){
  const d=S.d;c.textBaseline='alphabetic';
  // white fade that hides the bottom edge of the cut-out
  const f=c.createLinearGradient(0,1380,0,1500);f.addColorStop(0,'rgba(255,255,255,0)');f.addColorStop(1,'rgba(255,255,255,1)');c.fillStyle=f;c.fillRect(0,1380,W,H-1380);

  // top strip
  c.fillStyle=INK;c.font='700 44px "Noto Sans JP",sans-serif';c.textAlign='left';c.fillText(d.num,36,94);
  c.fillRect(56,110,2,370);
  c.fillStyle=INK;const parts=d.topline.split('／');let tx=120;
  parts.forEach((p,i)=>{tx+=drawJ(c,p,tx,82,20,GO(700),{track:0.5});if(i<parts.length-1){c.fillStyle='#9aa39f';c.fillRect(tx+14,64,1.5,22);c.fillStyle=INK;tx+=30;}});
  c.fillStyle=INK;d.price.split('\n').forEach((l,i)=>drawJ(c,l,1040,128+i*18,13,GO(500),{align:'right'}));

  // left headline block
  c.fillStyle=INK;drawJ(c,d.lLead,84,430,19,GO(700),{track:1});
  drawJ(c,d.l1,78,512,70,MIN(800),{smallK:0.55});
  drawJ(c,d.l2,78,590,60,MIN(800),{smallK:0.55});
  drawJ(c,d.l3,78,672,74,MIN(800));
  c.font=GO(700)(19);const bw=layoutJ(c,d.lBand,19,GO(700),1).width;
  c.fillStyle=TEAL;c.fillRect(80,694,bw+22,32);c.fillStyle='#fff';drawJ(c,d.lBand,91,717,19,GO(700),{track:1});
  c.fillStyle=INK;drawJ(c,d.lNote,82,758,18,GO(500));

  c.fillStyle='#8b938f';c.font='500 13px "Noto Sans JP",sans-serif';if('letterSpacing' in c)c.letterSpacing='3px';c.fillText(d.iLab,84,822);if('letterSpacing' in c)c.letterSpacing='0px';
  c.fillStyle=INK;drawJ(c,d.iName,82,856,27,MIN(700),{smallK:0.6});
  drawJ(c,d.s1a,84,920,15,GO(500));drawJ(c,d.s1b,82,950,23,MIN(700));
  drawJ(c,d.s2a,84,1004,15,GO(500));drawJ(c,d.s2b,82,1036,25,MIN(700));

  // left box (the only framed element, as on real covers)
  c.strokeStyle='#b9c0bc';c.lineWidth=1.5;c.strokeRect(70,1080,240,320);
  c.fillStyle='#fff';c.fillRect(71,1081,238,318);
  c.fillStyle=INK;drawJ(c,d.bxTop,190,1116,15,GO(700),{align:'center'});
  c.fillStyle=TEAL;const bxw=drawJ(c,d.bxBig,190,1170,44,MIN(800),{align:'center'});
  c.fillRect(190-bxw/2,1182,bxw,2);
  c.fillStyle=INK;d.bxSub.split('\n').forEach((l,i)=>drawJ(c,l,190,1218+i*26,17,GO(700),{align:'center'}));
  c.fillStyle='#b9c0bc';for(let i=0;i<14;i++){c.beginPath();c.arc(96+i*14,1282,1.6,0,7);c.fill();}
  c.fillStyle='#7d8682';drawJ(c,d.bxTag,190,1312,14,GO(500),{align:'center'});
  c.fillStyle=TEAL;drawJ(c,d.bxHand,190,1352,36,HAND,{align:'center'});
  c.fillStyle=INK;drawJ(c,d.bxEnd,190,1384,15,GO(700),{align:'center'});

  // right: supplement + yellow circle
  notebook(c,d);
  c.fillStyle=YEL;c.beginPath();c.arc(866,800,168,0,Math.PI*2);c.fill();
  c.fillStyle=INK;
  drawJ(c,d.c1,866,782,74,MIN(700),{align:'center',smallK:0.5});
  drawJ(c,d.c2,866,826,30,MIN(700),{align:'center'});
  drawJ(c,d.c3,866,884,42,MIN(700),{align:'center',track:1});
  c.font=GO(700)(17);const pw=layoutJ(c,d.cPill,17,GO(700),1).width+36;
  c.fillStyle=INK;c.beginPath();c.roundRect?c.roundRect(866-pw/2,925,pw,34,17):c.rect(866-pw/2,925,pw,34);c.fill();
  c.fillStyle='#fff';drawJ(c,d.cPill,866,948,17,GO(700),{align:'center',track:1});

  c.fillStyle=INK;d.r1.split('\n').forEach((l,i)=>drawJ(c,l,1046,1028+i*30,22,MIN(700),{align:'right'}));
  drawJ(c,d.r2a,1046,1110,14,GO(500),{align:'right'});
  drawJ(c,d.r2b,1046,1140,24,MIN(700),{align:'right'});
  // small circle
  c.fillStyle=YEL;c.beginPath();c.arc(948,1290,92,0,Math.PI*2);c.fill();
  c.fillStyle=INK;const cols=d.sc.split('\n').length;drawV(c,d.sc,948+(cols-1)*14,1218,26,MIN(800),1.1);
  c.font=GO(700)(14);const sw=layoutJ(c,d.scLab,14,GO(700),1).width+20;
  c.fillStyle=INK;c.fillRect(948-sw/2,1386,sw,26);c.fillStyle='#fff';drawJ(c,d.scLab,948,1404,14,GO(700),{align:'center',track:1});

  // bottom feature
  c.fillStyle=INK;
  const leadW=layoutJ(c,d.bLead,26,MIN(700)).width;c.font=HAND(34);const handW=layoutJ(c,d.bHand,34,HAND).width;
  const tot=leadW+18+handW;let bx=W/2-tot/2;
  drawJ(c,d.bLead,bx,1545,26,MIN(700));c.fillStyle=TEAL;drawJ(c,d.bHand,bx+leadW+18,1547,34,HAND);
  const bs=fitJ(c,d.bBig,170,MIN(800),990,2);
  c.fillStyle=TEAL;drawJ(c,d.bBig,W/2,1718,bs,MIN(800),{align:'center',track:2*bs/170});
  // checklist in two rows
  const items=d.chk.split('\n').filter(Boolean);const rows=[items.slice(0,Math.ceil(items.length/2)),items.slice(Math.ceil(items.length/2))];
  rows.forEach((r,ri)=>{const y=1772+ri*34;let widths=r.map(t=>layoutJ(c,t,17,GO(700)).width+30);
    let x=W/2-(widths.reduce((a,b)=>a+b,0)+(r.length-1)*26)/2;
    r.forEach((t,i)=>{c.fillStyle=TEAL;c.font=GO(900)(18);c.textAlign='left';c.fillText('✓',x,y);c.fillStyle=INK;drawJ(c,t,x+24,y,17,GO(700));x+=widths[i]+26;});});
}
function drawGuide(c){
  c.save();c.strokeStyle='rgba(42,157,143,.55)';c.setLineDash([12,9]);c.lineWidth=3;
  c.beginPath();c.ellipse(560,660,125,155,0,0,Math.PI*2);c.stroke();
  c.beginPath();c.moveTo(330,1500);c.bezierCurveTo(320,1100,400,900,470,870);c.lineTo(650,870);c.bezierCurveTo(740,900,800,1100,790,1500);c.stroke();
  c.setLineDash([]);c.fillStyle='rgba(42,157,143,.85)';c.font='700 24px "Noto Sans JP",sans-serif';c.textAlign='center';c.fillText('ここに切り抜き人物',560,1180);
  c.font='500 18px "Noto Sans JP",sans-serif';c.fillText('胸から上・顔は円のあたり',560,1212);c.restore();
}
function drawCut(c){if(!cut)return;const s=(1150/cut.height)*cutT.s;const w=cut.width*s,h=cut.height*s;c.drawImage(cut,560-w/2+cutT.x,1500-h+cutT.y,w,h);}
function compose(kind){
  const c2=document.createElement('canvas');c2.width=W;c2.height=H;const x=c2.getContext('2d');
  if(kind==='back')drawBack(x);else if(kind==='text')drawText(x);
  else{drawBack(x);if(cut)drawCut(x);else if(kind==='preview'&&S.guide)drawGuide(x);drawText(x);}
  return c2;
}
let raf;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{ctx.clearRect(0,0,W,H);ctx.drawImage(compose('preview'),0,0);});}

/* ---------- UI ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('fields').innerHTML='<h2>文字を変える</h2><p class="hint">改行で行が変わります。<code>^の^</code> のように ^ ではさむと、その文字だけ小さくなります（雑誌によくある「教育費<small>の</small>」の組み方）。</p>'+
 FIELDS.map(([g,fs],i)=>`<details class="group"${i<2?' open':''}><summary>${g}</summary>${fs.map(([k,l])=>`<div class="field"><label for="f-${k}">${l}</label><textarea id="f-${k}" data-k="${k}" rows="${Math.max(1,String(S.d[k]).split('\n').length)}">${esc(S.d[k])}</textarea></div>`).join('')}</details>`).join('')+
 '<div class="row"><button class="btn" type="button" id="reset">最初の文に戻す</button></div>';
document.getElementById('fields').addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;S.d[t.dataset.k]=t.value;t.rows=Math.max(1,t.value.split('\n').length);save();render();});
document.getElementById('reset').addEventListener('click',()=>{S.d={...DEF};document.querySelectorAll('[data-k]').forEach(t=>{t.value=S.d[t.dataset.k];t.rows=Math.max(1,t.value.split('\n').length);});save();render();});
const guide=document.getElementById('guide');guide.checked=S.guide;guide.addEventListener('change',()=>{S.guide=guide.checked;save();render();});
document.getElementById('cut').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{cut=i;render();};i.src=URL.createObjectURL(f);e.target.value='';});
document.getElementById('cutClear').addEventListener('click',()=>{cut=null;render();});
[['cs','s'],['cx','x'],['cy','y']].forEach(([id,k])=>document.getElementById(id).addEventListener('input',e=>{cutT[k]=+e.target.value;render();}));
const modal=document.getElementById('modal'),outImg=document.getElementById('outImg'),outNote=document.getElementById('outNote');
document.querySelectorAll('[data-out]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.out;outImg.src=compose(k).toDataURL('image/png');
  outNote.textContent=(k==='text'?'背景が透明な画像です（市松模様は透明の部分）。':'')+'画像を長押し（パソコンは右クリック）して保存してください。';modal.hidden=false;}));
document.getElementById('close').addEventListener('click',()=>{modal.hidden=true;});

render();
const fonts=['900 100px "M PLUS Rounded 1c"','500 40px "Shippori Mincho B1"','700 40px "Shippori Mincho B1"','800 40px "Shippori Mincho B1"','600 40px "Caveat"','600 40px "Klee One"','500 20px "Noto Sans JP"','700 20px "Noto Sans JP"','900 20px "Noto Sans JP"','500 40px "Bodoni Moda"','italic 500 40px "Bodoni Moda"'];
if(document.fonts){Promise.all(fonts.map(f=>document.fonts.load(f,'あ塾ジュクキュ!教育費想合格juku11'))).then(render,render);document.fonts.ready.then(render);}
setTimeout(render,2000);setTimeout(render,4500);
})();
</script>
