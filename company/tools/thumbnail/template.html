<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Thumbnail</title>
<style>
@font-face{font-family:Dela;src:url(fonts/dela-gothic-one-japanese-400-normal.woff2) format('woff2');}
@font-face{font-family:Dela;src:url(fonts/dela-gothic-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF;}
@font-face{font-family:Maru;src:url(fonts/m-plus-rounded-1c-japanese-800-normal.woff2) format('woff2');font-weight:800;}
@font-face{font-family:Maru;src:url(fonts/m-plus-rounded-1c-latin-800-normal.woff2) format('woff2');font-weight:800;unicode-range:U+0000-00FF;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a5fd6}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(circle at 50% 22%,#fff 0,#bfe3ff 18%,#4aa3ff 45%,#1556c9 80%,#0b3a99 100%)}
#rays{position:absolute;inset:-400px;background:repeating-conic-gradient(from 0deg at 50% 32%,rgba(255,255,255,.28) 0 6deg,rgba(255,255,255,0) 6deg 14deg)}
.stripe{position:absolute;left:0;right:0;height:46px;background:repeating-linear-gradient(-45deg,#111 0 34px,#ffd400 34px 68px)}
#money{position:absolute;top:70px;left:0;right:0;height:400px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;padding:0 60px}
.coin{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Dela;box-shadow:0 10px 24px rgba(0,0,0,.35), inset 0 0 0 8px rgba(255,255,255,.35), inset 0 -10px 20px rgba(0,0,0,.25);position:relative}
.c500{width:300px;height:300px;font-size:110px;color:#7a5200;background:radial-gradient(circle at 35% 30%,#fff6c4,#f2c94c 40%,#c99a1e 75%,#8a6510)}
.c100{width:170px;height:170px;font-size:60px;color:#555;background:radial-gradient(circle at 35% 30%,#fff,#d9dde3 45%,#9aa1aa)}
.c50{width:150px;height:150px;font-size:44px;color:#555;background:radial-gradient(circle at 35% 30%,#fff,#d9dde3 45%,#9aa1aa)}
.c50::after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:#4aa3ff;box-shadow:inset 0 3px 6px rgba(0,0,0,.4)}
.c50 span{transform:translateY(-38px)}
.c10{width:140px;height:140px;font-size:50px;color:#5a2a0a;background:radial-gradient(circle at 35% 30%,#ffd6b0,#d07a3a 45%,#8a4416)}
.bill{width:480px;height:250px;border-radius:14px;background:linear-gradient(135deg,#fffdf3,#efe6c8);border:6px solid #3b5aa8;box-shadow:0 12px 26px rgba(0,0,0,.35);position:relative;display:flex;align-items:center;justify-content:flex-start;padding-left:34px;font-family:Dela;color:#3b5aa8;font-size:110px;transform:rotate(var(--r,0deg))}
.bill::before{content:"";position:absolute;inset:14px;border:3px dashed #8aa0d8;border-radius:8px}
.bill .mihon{position:absolute;font-family:Maru;font-weight:800;font-size:58px;color:rgba(220,20,40,.9);border:6px solid rgba(220,20,40,.9);border-radius:10px;padding:0 12px;right:12px;bottom:-26px;transform:rotate(-12deg);background:rgba(255,255,255,.7)}
#store{position:absolute;top:500px;left:50%;transform:translateX(-50%) rotate(-3deg);background:linear-gradient(#ff3b3b,#c80000);color:#fff;font-family:Dela;font-size:92px;padding:18px 70px 26px;border-radius:24px;border:8px solid #fff;box-shadow:0 12px 0 #7a0000,0 18px 30px rgba(0,0,0,.4);white-space:nowrap}
#price{position:absolute;top:640px;left:0;right:0;text-align:center;font-family:Dela;line-height:1;white-space:nowrap}
#price .wrap{display:inline-grid}
#price .wrap>span{grid-area:1/1;font-size:var(--ps,280px);position:relative}
#price .l3{z-index:1;color:#fff;-webkit-text-stroke:46px #fff;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
#price .l2{z-index:2;color:#c80000;-webkit-text-stroke:24px #c80000}
#price .num{z-index:3;background:linear-gradient(#fffbe0 0%,#ffe04a 40%,#ffb800 70%,#ff8a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#burst{position:absolute;top:930px;left:50%;transform:translateX(-50%);width:820px;height:240px;background:#ffe600;clip-path:polygon(0% 50%,7% 20%,4% 0%,20% 14%,30% 0%,40% 12%,50% 0%,60% 12%,70% 0%,80% 14%,96% 0%,93% 20%,100% 50%,93% 80%,96% 100%,80% 86%,70% 100%,60% 88%,50% 100%,40% 88%,30% 100%,20% 86%,4% 100%,7% 80%)}
#shiire{position:absolute;top:948px;left:0;right:0;text-align:center;font-family:Dela;font-size:170px;color:#e00000;line-height:1.15;-webkit-text-stroke:10px #fff;paint-order:stroke fill}
#photo{position:absolute;top:1190px;left:90px;right:90px;height:600px;border-radius:36px;border:14px solid #fff;box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden;background:#dfe8f5;display:flex;align-items:center;justify-content:center}
#photo img{width:100%;height:100%;object-fit:cover}
#photo .ph{font-family:Maru;font-weight:800;font-size:64px;color:#6b7c99;text-align:center;line-height:1.4}
#souba{position:absolute;top:1130px;right:40px;transform:rotate(6deg);background:#fff;border:8px solid #e00000;border-radius:26px;padding:14px 30px;font-family:Dela;color:#e00000;font-size:58px;text-align:center;line-height:1.1;box-shadow:0 10px 20px rgba(0,0,0,.35)}
#souba small{display:block;font-family:Maru;font-weight:800;font-size:38px;color:#333}
#name{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-family:Maru;font-weight:800;font-size:46px;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="c">
  <div id="rays"></div>
  <div class="stripe" style="top:0"></div>
  <div id="money"></div>
  <div id="store"></div>
  <div id="price"><span class="wrap"><span class="l3"></span><span class="l2"></span><span class="num"></span></span></div>
  <div id="burst"></div>
  <div id="shiire">仕入れ</div>
  <div id="photo"><div class="ph">ここに<br>商品の写真</div></div>
  <div id="souba" hidden></div>
  <div id="name">💎ジャンク姉さん💎</div>
  <div class="stripe" style="bottom:0"></div>
</div>
<script>
const q=new URLSearchParams(location.search);
const price=parseInt(q.get('price')||'880',10);
const store=q.get('store')||'ハードオフ';
const t=price.toLocaleString('ja-JP')+'円';
document.getElementById('store').textContent=store+'で';
document.querySelectorAll('#price .wrap>span').forEach(e=>e.textContent=t);
if(q.get('souba')){const s=document.getElementById('souba');s.hidden=false;s.innerHTML='<small>相場</small>'+parseInt(q.get('souba'),10).toLocaleString('ja-JP')+'円';}
if(q.get('photo')){document.getElementById('photo').innerHTML='<img src="'+q.get('photo').replace(/"/g,'')+'">';}
// お金：金額をお札・硬貨に分解（お札には必ず「見本」）
const m=document.getElementById('money');let r=price;const parts=[];
for(const d of [10000,5000,1000,500,100,50,10]){while(r>=d&&parts.length<9){parts.push(d);r-=d;}}
const bills=parts.filter(d=>d>=1000);
bills.forEach((d,i)=>{const b=document.createElement('div');b.className='bill';b.style.setProperty('--r',(i%2?6:-6)+'deg');
  if(bills.length>1){b.style.width='400px';b.style.fontSize='92px';b.style.margin='0 -8px';}b.innerHTML=d.toLocaleString('ja-JP')+'<span class="mihon">見本</span>';m.appendChild(b);});
const coins=parts.filter(d=>d<1000);if(coins.length>4)m.style.transform='scale(.82)';
coins.forEach(d=>{const c=document.createElement('div');c.className='coin c'+d;c.innerHTML='<span>'+d+'</span>';m.appendChild(c);});
document.fonts.ready.then(()=>{
  const pr=document.getElementById('price'),n=pr.querySelector('.num');
  pr.style.setProperty('--ps','280px');
  const fit=Math.min(280,Math.floor(280*900/n.getBoundingClientRect().width));
  pr.style.setProperty('--ps',fit+'px');
  pr.style.top=(800-fit/2)+'px';
  document.body.dataset.ready='1';});
</script>
</body>
</html>
